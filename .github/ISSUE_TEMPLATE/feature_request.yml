name: Feature request
description: An idea or a change to search quality
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you tried to find or do, and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen instead.
    validations:
      required: true
  - type: textarea
    id: numbers
    attributes:
      label: Evidence
      description: For ranking changes, `session-rag eval` numbers before and after on your own cases help a lot.
