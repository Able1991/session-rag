[project]
name = "session-rag"
version = "0.1.0"
description = "Local, private RAG over your Claude Code session history: hybrid search with secret redaction, exposed as an MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"  # onnxruntime wheels
authors = [{ name = "Boris Penkovskiy" }]
keywords = ["claude-code", "mcp", "rag", "search", "sqlite", "embeddings"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = [
  "fastembed>=0.9.1",
  "mcp[cli]>=2.3.0",
  "snowballstemmer>=3.1.1",
  "sqlite-vec>=0.1.9",
]

[project.scripts]
session-rag = "session_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session_rag"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/session_rag/digest.py" = ["E501"]  # a nosemgrep comment needs the full rule id on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
